# Eclipse Ditto 3.9 under Docker Compose: MongoDB, the five Ditto services on one Pekko cluster, nginx in
# front (basic auth), and a Prometheus / cAdvisor / Blackbox / Grafana observability stack. The sandbox is
# deploy/; scripts/up.sh starts it. Layered under .env: TARGET_URL / TARGET_USER / TARGET_PASSWORD and
# BREAK_POINT_COMPOSE_PROJECT there win (set the project to `bosch-ditto` to attach to an upstream stack).
app_name: Eclipse Ditto (an IoT digital-twin platform)
compose_file: deploy/docker-compose.yml
nginx_conf: deploy/nginx/nginx.conf
compose_project: break_point
target_url: http://127.0.0.1:8080
target_user: ditto
target_password: ditto
thresholds_file: thresholds.yaml
links:
  Ditto API: http://127.0.0.1:8080/api/2/things
  Ditto UI: http://127.0.0.1:8080/ui/
  Prometheus: http://127.0.0.1:9090
  Grafana: "http://127.0.0.1:3000 (anonymous viewer; admin / $GRAFANA_ADMIN_PASSWORD, default admin)"
  API credentials: "ditto / ditto (devops: devops / $DEVOPS_PASSWORD, default foobar)"
