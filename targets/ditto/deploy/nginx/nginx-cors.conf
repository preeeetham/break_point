# CORS snippet included in API locations.
# Preflight requests are answered directly by nginx; normal responses get the headers
# added with "always" so error responses (4xx/5xx) from the gateway carry them too.

if ($request_method = 'OPTIONS') {
  add_header 'Access-Control-Allow-Origin' '*';
  add_header 'Access-Control-Allow-Methods' 'GET, POST, PUT, PATCH, DELETE, OPTIONS';
  add_header 'Access-Control-Allow-Headers' 'Authorization, Content-Type, Accept, Origin, Cache-Control, If-Match, If-None-Match, x-ditto-pre-authenticated, x-correlation-id, response-required, timeout, requested-acks, condition, live-channel-condition, channel, DNT, User-Agent, X-Requested-With, Keep-Alive, X-Mx-ReqToken';
  add_header 'Access-Control-Expose-Headers' 'ETag, Location, correlation-id, x-correlation-id, response-required';
  add_header 'Access-Control-Max-Age' 1728000;
  add_header 'Content-Type' 'text/plain; charset=utf-8';
  add_header 'Content-Length' 0;
  return 204;
}

add_header 'Access-Control-Allow-Origin' '*' always;
add_header 'Access-Control-Allow-Methods' 'GET, POST, PUT, PATCH, DELETE, OPTIONS' always;
add_header 'Access-Control-Allow-Headers' 'Authorization, Content-Type, Accept, Origin, Cache-Control, If-Match, If-None-Match, x-ditto-pre-authenticated, x-correlation-id, response-required, timeout, requested-acks, condition, live-channel-condition, channel, DNT, User-Agent, X-Requested-With, Keep-Alive, X-Mx-ReqToken' always;
add_header 'Access-Control-Expose-Headers' 'ETag, Location, correlation-id, x-correlation-id, response-required' always;
