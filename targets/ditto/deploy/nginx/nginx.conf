# Faultline reverse proxy for Eclipse Ditto (derived from Ditto's upstream nginx.conf).
# nginx is the only published entry point; it terminates basic auth and forwards the
# authenticated user to the gateway via the x-ditto-pre-authenticated header.

worker_processes auto;

events {
  worker_connections 1024;
}

http {
  include /etc/nginx/mime.types;
  default_type application/json;
  server_tokens off;

  proxy_connect_timeout 70;
  proxy_send_timeout 70;
  proxy_read_timeout 70;
  send_timeout 70;

  client_header_buffer_size 8k;
  large_client_header_buffers 4 16k;
  merge_slashes off;

  server {
    listen 80;
    server_name localhost;

    location / {
      index index.html;
    }

    # Ditto HTTP API (basic auth -> pre-authentication header)
    location /api {
      include nginx-cors.conf;

      auth_basic "Authentication required";
      auth_basic_user_file nginx.htpasswd;

      proxy_pass http://gateway:8080;
      proxy_http_version 1.1;
      proxy_set_header Host $http_host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-User $remote_user;
      proxy_set_header x-ditto-pre-authenticated "nginx:${remote_user}";

      # Needed for Server-Sent Events (SSE)
      proxy_set_header Connection '';
      chunked_transfer_encoding off;
      proxy_buffering off;
      proxy_cache off;
    }

    # Ditto WebSocket
    location /ws {
      auth_basic "Authentication required";
      auth_basic_user_file nginx.htpasswd;

      proxy_pass http://gateway:8080;
      proxy_http_version 1.1;
      proxy_set_header Host $http_host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-User $remote_user;
      proxy_set_header x-ditto-pre-authenticated "nginx:${remote_user}";

      proxy_set_header Upgrade $http_upgrade;
      proxy_set_header Connection "upgrade";
      proxy_read_timeout 1d;
      proxy_send_timeout 1d;
    }

    # Gateway health (no auth) - used by scripts/up.sh and blackbox probes
    location /health {
      proxy_pass http://gateway:8080;
      proxy_http_version 1.1;
      proxy_set_header Host $http_host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    # Overall cluster status (no auth at nginx; gateway enforces its status password)
    location /status {
      proxy_pass http://gateway:8080/overall/status;
      proxy_http_version 1.1;
      proxy_set_header Host $http_host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    # DevOps API (no auth at nginx; gateway enforces its own devops password)
    location /devops {
      proxy_pass http://gateway:8080;
      proxy_http_version 1.1;
      proxy_set_header Host $http_host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    # Ditto UI
    location /ui/ {
      proxy_pass http://ditto-ui:8080/;
      proxy_http_version 1.1;
      proxy_set_header Host $http_host;
    }
  }
}
