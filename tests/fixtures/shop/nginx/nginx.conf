# Test fixture: the invented shop's reverse proxy. nginx is the only published entry point.
worker_processes auto;
events { worker_connections 1024; }
http {
  proxy_connect_timeout 70;
  proxy_send_timeout 70;
  proxy_read_timeout 70;
  server {
    listen 80;
    location /api { proxy_pass http://gateway:8080; }
    location /health { proxy_pass http://gateway:8080; }
    location /ui/ { proxy_pass http://web-ui:8080/; }
  }
}
