# Defaults. Anything here can be overridden by the selected target (targets/<name>/target.yaml),
# by .env (see .env.example) or by the environment. Nothing here names a target application:
# choose one with FAULTLINE_TARGET, see docs/ONBOARDING_A_TARGET.md.
compose_project: faultline
target_url: http://127.0.0.1:8080
prometheus_url: http://127.0.0.1:9090
llm_provider: ollama
llm_model: phi4-mini
llm_timeout_s: 120
probe_rps: 4
health_interval_s: 3
pumba_image: gaiaadm/pumba:latest
tc_image: ghcr.io/alexei-led/pumba-alpine-nettools:latest
dashboard_port: 8765
