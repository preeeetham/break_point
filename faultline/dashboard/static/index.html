<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="dark">
<title>Faultline Control Room</title>
<link rel="stylesheet" href="/static/tokens.css">
<link rel="stylesheet" href="/static/app.css">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='none' stroke='%23FF7A1A' stroke-width='2.2' stroke-linecap='round' stroke-linejoin='round'%3E%3Cpath d='M13 2 4 14h7l-1 8 9-12h-7z'/%3E%3C/svg%3E">
</head>
<body>
<a class="skip-link sr-only" href="#main">Skip to the live stage</a>

<div class="app" id="app" data-drawer="closed">

  <header class="app__header" id="header">
    <button class="drawer-toggle btn btn--ghost btn--icon" id="drawer-toggle" type="button"
            aria-controls="left" aria-expanded="false" aria-label="Show the injection console">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor"
           stroke-width="1.75" stroke-linecap="round" aria-hidden="true">
        <path d="M4 6.5h16M4 12h16M4 17.5h16"/>
      </svg>
    </button>
    <div class="brand">
      <span class="brand__mark" aria-hidden="true"></span>
      <span class="brand__text">
        <span class="brand__name">FAULTLINE</span>
        <span class="brand__sub">control room</span>
      </span>
    </div>
    <div class="ribbon" id="ribbon" role="group" aria-label="Experiment phase"></div>
    <div class="row" id="header-right"></div>
  </header>

  <aside class="app__left" id="left" aria-label="Injection console">
    <div id="launcher-host"></div>
  </aside>

  <main class="app__main" id="main" tabindex="-1">
    <section class="panel panel--pipeline" data-panel="pipeline">
      <div class="panel__head" id="head-pipeline"></div>
      <div class="panel__body panel__body--flush" id="pipeline-host"></div>
    </section>

    <section class="panel panel--graph" data-panel="graph">
      <div class="panel__head" id="head-graph"></div>
      <div class="panel__body panel__body--flush graph" id="graph-host"></div>
    </section>

    <section class="panel panel--chart" data-panel="chart">
      <div class="panel__head" id="head-chart"></div>
      <div class="panel__body panel__body--flush" id="chart-host"></div>
    </section>

    <section class="panel panel--kpis" data-panel="kpis">
      <div class="panel__head" id="head-kpis"></div>
      <div class="panel__body panel__body--tight" id="kpis-host"></div>
    </section>
  </main>

  <aside class="app__right" id="right" aria-label="Agent activity">
    <section class="panel panel--feed">
      <div class="panel__head" id="head-feed"></div>
      <div class="panel__body panel__body--flush" id="feed-host"></div>
    </section>
  </aside>

  <!-- Predicted, never measured. Sits above the experiments because it is the one panel that has
       something to say before anything has been broken. See docs/UI_CONTRACT.md §4. -->
  <section class="panel panel--weaknesses" data-panel="weaknesses">
    <div class="panel__head" id="head-weaknesses"></div>
    <div class="panel__body panel__body--tight" id="weaknesses-host"></div>
  </section>

  <section class="app__exp" id="exp">
    <section class="panel panel--experiments" data-panel="experiments">
      <div class="panel__head" id="head-experiments"></div>
      <div class="panel__body panel__body--tight" id="experiments-host"></div>
    </section>
    <section class="panel panel--scorecard" data-panel="scorecard">
      <div class="panel__head" id="head-scorecard"></div>
      <div class="panel__body" id="scorecard-host"></div>
    </section>
  </section>

  <section class="panel panel--fixes" data-panel="fixes">
    <div class="panel__head" id="head-fixes"></div>
    <div class="panel__body panel__body--tight" id="fixes-host"></div>
  </section>

  <!-- Repo onboarding: what lets Faultline be pointed at any compose app, not only Ditto.
       onboard.js owns this element's whole subtree (panel chrome included), the same way
       launcher.js owns #launcher-host. It closes the page in its own full-width row, so it
       never competes for a named grid area at any breakpoint. -->
  <div id="onboard-host" data-panel="onboard" style="grid-column: 1 / -1"></div>

</div>

<div class="toast-stack" id="toasts" aria-live="polite" aria-atomic="false"></div>
<div class="drawer-scrim" id="drawer-scrim"></div>

<noscript>
  <p style="padding:24px;color:#E8EDF7;font:14px system-ui">
    Faultline Control Room needs JavaScript. The same data is on disk as JSON and Markdown under
    <code>reports/</code>, and the CLI (<code>faultline status</code>, <code>faultline narrate</code>)
    works without a browser.
  </p>
</noscript>

<script type="module" src="/static/app.js"></script>
</body>
</html>
